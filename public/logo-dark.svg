<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" fill="none">
  <defs>
    <!-- Glowing Violet Gradient -->
    <linearGradient id="dk-lens-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#7C66FF"/>
      <stop offset="100%" stop-color="#5843E0"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="dk-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <!-- Subtle Violet Glow -->
    <filter id="dk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7C66FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 4)" filter="url(#dk-glow)">
    <circle cx="38" cy="36" r="23" stroke="url(#dk-lens-grad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 54.5 52.5 L 75.5 73.5" stroke="url(#dk-lens-grad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 38 14 Q 38 20.5 44.5 20.5 Q 38 20.5 38 27 Q 38 20.5 31.5 20.5 Q 38 20.5 38 14 Z" fill="url(#dk-spark-grad)"/>
    <rect x="34.75" y="34" width="6.5" height="15" rx="3.25" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.02em">
      <tspan fill="#7C66FF">i</tspan><tspan fill="#FFFFFF">Find</tspan>
    </text>
    <text x="2" y="18" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.15em">AI INTERNSHIPS</text>
  </g>
</svg>