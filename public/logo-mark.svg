<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Electric Violet Gradient -->
    <linearGradient id="ifind-mark-grad" x1="10%" y1="5%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF"/>
      <stop offset="45%" stop-color="#6D5AE6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Spark Glow Gradient -->
    <linearGradient id="ifind-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D5AE6"/>
    </linearGradient>

    <!-- Soft Ambient Shadow for Depth -->
    <filter id="ifind-lens-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6D5AE6" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#ifind-lens-shadow)">
    <!-- Search Lens Ring -->
    <circle cx="210" cy="205" r="120" stroke="url(#ifind-mark-grad)" stroke-width="32" stroke-linecap="round"/>

    <!-- 45-degree Dynamic Search Handle -->
    <path d="M 298 293 L 412 407" stroke="url(#ifind-mark-grad)" stroke-width="32" stroke-linecap="round"/>

    <!-- AI Discovery Spark (Tittle of the 'i') -->
    <!-- Four-pointed star curve with focal center at (210, 120) -->
    <path d="M 210 86 Q 210 120 244 120 Q 210 120 210 154 Q 210 120 176 120 Q 210 120 210 86 Z" fill="url(#ifind-spark-grad)"/>

    <!-- Stem of the 'i' (Navy Pillar) -->
    <rect x="194" y="196" width="32" height="78" rx="16" fill="#172554"/>
  </g>
</svg>