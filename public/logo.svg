<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" fill="none">
  <defs>
    <!-- Violet Lens Gradient -->
    <linearGradient id="p-lens-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF"/>
      <stop offset="50%" stop-color="#6D5AE6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="p-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D5AE6"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="p-mark-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6D5AE6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 4)" filter="url(#p-mark-shadow)">
    <!-- Lens Ring (Center: 38, 36; Radius: 23; Stroke: 6.5) -->
    <circle cx="38" cy="36" r="23" stroke="url(#p-lens-grad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- 45-degree Handle -->
    <path d="M 54.5 52.5 L 75.5 73.5" stroke="url(#p-lens-grad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- AI Discovery Spark (Center: 38, 20.5) -->
    <path d="M 38 14 Q 38 20.5 44.5 20.5 Q 38 20.5 38 27 Q 38 20.5 31.5 20.5 Q 38 20.5 38 14 Z" fill="url(#p-spark-grad)"/>

    <!-- Stem of 'i' (Navy) -->
    <rect x="34.75" y="34" width="6.5" height="15" rx="3.25" fill="#172554"/>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.02em">
      <tspan fill="#6D5AE6">i</tspan><tspan fill="#172554">Find</tspan>
    </text>
    <text x="2" y="18" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="0.15em">AI INTERNSHIPS</text>
  </g>
</svg>