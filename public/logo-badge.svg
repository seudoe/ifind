<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient (Deep Navy / Midnight) -->
    <linearGradient id="badge-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>

    <!-- Lens Gradient -->
    <linearGradient id="badge-lens-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C66FF"/>
      <stop offset="100%" stop-color="#5843E0"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="badge-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6D5AE6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with 1px border shine -->
  <rect width="128" height="128" rx="28" fill="url(#badge-bg-grad)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Subtle Radial Spotlight in Center -->
  <circle cx="53" cy="51" r="42" fill="#6D5AE6" fill-opacity="0.16"/>

  <g filter="url(#badge-glow)">
    <!-- Lens Ring -->
    <circle cx="53" cy="51" r="28" stroke="url(#badge-lens-grad)" stroke-width="7.5" stroke-linecap="round"/>

    <!-- Handle -->
    <path d="M 73 71 L 97 95" stroke="url(#badge-lens-grad)" stroke-width="7.5" stroke-linecap="round"/>

    <!-- AI Spark Dot -->
    <path d="M 53 31 Q 53 38 60 38 Q 53 38 53 45 Q 53 38 46 38 Q 53 38 53 31 Z" fill="url(#badge-spark-grad)"/>

    <!-- Stem of 'i' -->
    <rect x="49.25" y="50" width="7.5" height="17" rx="3.75" fill="#FFFFFF"/>
  </g>
</svg>