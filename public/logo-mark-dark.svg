<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ifind-mark-grad-dark" x1="10%" y1="5%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#7C66FF"/>
      <stop offset="100%" stop-color="#5843E0"/>
    </linearGradient>
    <linearGradient id="ifind-spark-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="ifind-glow-dark" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7C66FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ifind-glow-dark)">
    <!-- Search Lens Ring -->
    <circle cx="210" cy="205" r="120" stroke="url(#ifind-mark-grad-dark)" stroke-width="32" stroke-linecap="round"/>

    <!-- 45-degree Dynamic Search Handle -->
    <path d="M 298 293 L 412 407" stroke="url(#ifind-mark-grad-dark)" stroke-width="32" stroke-linecap="round"/>

    <!-- AI Discovery Spark (Tittle of the 'i') -->
    <path d="M 210 86 Q 210 120 244 120 Q 210 120 210 154 Q 210 120 176 120 Q 210 120 210 86 Z" fill="url(#ifind-spark-grad-dark)"/>

    <!-- Stem of the 'i' (Pure White) -->
    <rect x="194" y="196" width="32" height="78" rx="16" fill="#FFFFFF"/>
  </g>
</svg>